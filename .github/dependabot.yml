# R11-MP20: the update feed the pins need. Pinning by commit and digest stops a
# moved tag from changing what CI and the images run; without a feed it also stops
# security fixes arriving. Weekly, grouped, so a pin update is one reviewable PR.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: "/ui-next"
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: "/ui-next"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
