# Continuous integration.
#
# Until this file existed there was no CI at all, while several documents
# (`Docs/40-engineering/03-coding-standards.md`, `Docs/30-contracts/01-contract-strategy.md`)
# stated that various checks "fail CI". Every gate below is one of those claims, made real.
#
# The gates, and the claim each one enforces:
#
#   ruff          -- Docs/40-engineering/03-coding-standards.md
#   mypy --strict -- part of INV-2's enforcement: `ConnectorRegistry.create` returns
#                    `Connector`, which has no SQL-accepting member, so a second
#                    execution path is a type error rather than a code review question
#   lint-imports  -- ADR-0004 / INV-2 gateway exclusivity (tracker QG-7), plus the
#                    identity_tenancy privacy and security_types ratchet contracts
#   alembic       -- exactly one migration head; a second head is a merge accident
#                    that only shows up at deploy time
#   openapi-diff  -- tracker TS-4: a breaking change to the public HTTP API
#                    (removed path/operation, newly-required request field,
#                    removed response field, narrowed enum, ...) fails CI
#                    unless acknowledged with an API version bump. See
#                    `scripts/openapi_diff.py`.
#   ui-types-diff -- tracker UX-14: `ui-next/src/lib/types.ts` is generated
#                    from `app.openapi()`'s `components.schemas` by
#                    `scripts/generate_ui_types.py`; a drift between it and
#                    what's committed (i.e. a `schemas.py`/`platform_schemas.py`
#                    change that never regenerated the TypeScript side) fails
#                    CI instead of surfacing as a runtime `undefined` in the
#                    browser. Same `--accept-baseline` idiom as `openapi-diff`
#                    and `perf-baseline` above.
#   ui-next        -- tracker UX-14: `ui-next` had no CI coverage at all --
#                    `tsc --noEmit`, `vitest run` and `vite build` never ran
#                    anywhere but a developer's own machine. This job runs
#                    all three against the committed (generated) types.ts, so
#                    a type that doesn't actually match how the app uses it
#                    fails here even when `ui-types-diff` above is green.
#   perf-baseline -- tracker PF-3: a small set of fast, deterministic
#                    in-process hot paths (the SQL guard pipeline, ABAC
#                    evaluation, hybrid-retrieval fusion ranking, OpenAPI
#                    generation) is timed and compared against a committed
#                    baseline; a benchmark that reproduces more than 20%
#                    slower on re-measurement fails CI. This is the CI-runner
#                    regression-gate mechanism, not the bank-scale load/soak/
#                    spike testing tracked separately (PF-1/PF-2/PF-4/PF-7,
#                    TS-7). See `scripts/perf_baseline.py`.
#   quality-baseline -- tracker AG-8: PF-3's quality/accuracy counterpart. Retrieval
#                    precision/recall/MRR (a small deterministic seeded catalog run
#                    through the real `hybrid_retrieve_enhanced`) and tool/generation-path
#                    selection pass rate (the real `GovernedPlanner.plan`) are compared
#                    against a committed baseline; either dropping more than 5 points
#                    fails CI. Also (re)publishes `Docs/90-reference/quality-benchmark-
#                    results.md`. Not the bank-scale 1M-object benchmark tracked
#                    separately as RT-8/PF-1. See `scripts/quality_benchmark.py`.
#   connector-version-fixtures -- tracker CN-3: two real PostgreSQL service
#                    containers (16 and 14), against IN-5d's standing gap that
#                    no 1.1 discovery statement on any connector had run
#                    against a live source. See
#                    tests/test_postgres_version_fixtures.py.
#   pytest        -- includes tests/test_tier0_invariants.py, the Tier-0 invariant suite.
#                    Also carries AU-14's coverage gate: `pytest-cov` was a declared dev
#                    dependency invoked nowhere until now. `--cov=aida --cov=atlas` (source/
#                    omit rules in `pyproject.toml`'s `[tool.coverage.*]`) measures both
#                    packages, `--cov-report=term-missing` puts the per-file gap in the job
#                    log, `--cov-report=xml` uploads a Cobertura report as a build artifact,
#                    and `--cov-fail-under=<floor>` (see `Docs/90-reference/
#                    coverage-baseline.md` for the measured baseline this floor was set
#                    from, and the reasoning behind the specific number) fails the job on a
#                    regression below a level the suite already clears today -- a ratchet
#                    against backsliding, not a target still to be reached.
#   migration-drift -- tracker AU-8: Docs/60-delivery/04-end-to-end-audit-2026-08-30.md
#                    Section 5 found that every DB-backed test builds schema from the ORM
#                    (`Base.metadata.create_all` against in-memory SQLite), never by running
#                    the 94+ real Alembic migrations, so ORM<->migration drift was
#                    structurally invisible -- and had already fired once (DQ-1) with no
#                    gate added. tests/test_migration_orm_drift.py applies every migration
#                    to an empty Postgres database and diffs the result against
#                    `Base.metadata`; it needs a real Postgres (migrations use
#                    Postgres-only DDL), provided here by a service container -- the only
#                    job that needs one, which is why it's split from `tests` rather than
#                    added to it.
#   reachability  -- tracker AU-1: Docs/60-delivery/04-end-to-end-audit-2026-08-30.md found
#                    ~4,600 lines behind 17 DONE rows importable from no running process --
#                    fully unit-tested, zero live callers, invisible to every gate above.
#                    tests/test_reachability_gate.py walks a full AST import graph from the
#                    five real entry points (main, worker, scheduler, graph_projector,
#                    outbox_publisher) and fails on any src/aida module unreachable from all
#                    of them, unless it's on that file's small, named, tracker-row-justified
#                    allow-list.
#   dependency-scan -- tracker AU-13: the same audit found no dependency-vulnerability scan
#                    and no SBOM. pip-audit runs against the exact `uv.lock`-locked, non-dev
#                    dependency set (via `uv export --frozen --no-dev`) -- the same set the
#                    Dockerfile now installs -- and fails on any *unbaselined* known
#                    vulnerability; a small, dated, named --ignore-vuln baseline (see the
#                    step) covers what's already in the locked set today so this gate blocks
#                    new regressions without retroactively red-lining every push on
#                    pre-existing, out-of-file-scope dependency debt. A CycloneDX SBOM is
#                    generated and uploaded alongside the full (unbaselined) report.
#   frontend-dependency-scan -- review-2026-09-05 §7: the backend had pip-audit against
#                    the locked non-dev set; `ui-next` had no dependency scan at all,
#                    231 resolved packages and a committed lockfile that nothing looked
#                    at. `scripts/check_npm_audit.py` runs `npm audit --json
#                    --package-lock-only` against `ui-next/package-lock.json` (no
#                    `npm ci` needed) and fails on any *unbaselined* advisory -- same
#                    design as the pip-audit gate, with a small, dated, named baseline
#                    in that script for what is already present today. Two deliberate
#                    differences, both stated in the script: it scans the whole lockfile
#                    rather than the non-dev set, because vite/esbuild/vitest are what
#                    *build* the artifact the browser runs; and a baselined dev-only
#                    advisory that later reaches a runtime dependency fails anyway.
#   frontend-reachability -- review-2026-09-05 §7 asked for a reachability review across
#                    BOTH namespaces. The backend half is `reachability` above; this is
#                    the missing half. `scripts/check_frontend_reachability.py` walks a
#                    static import graph over `ui-next/src` from the entry points it
#                    derives (index.html's module script, vitest's setupFiles), follows
#                    `React.lazy(() => import(...))` -- without which all 45 lazy screens
#                    read as dead -- and fails on any module reachable from nothing.
#                    Statement-level `import type` is tracked but does NOT confer
#                    reachability: TypeScript erases it, and that is exactly how
#                    `ProposalCard.tsx` (D01) looked alive while shipping in no bundle.
#   destination-inventory -- review-2026-09-05 §6 item 7: no unified inventory of
#                    external destinations and credential references existed.
#                    `scripts/generate_destination_inventory.py` derives one from
#                    `atlas.platform.config.Settings` and from how `src/` reads it, with
#                    configured / approved / active / healthy / verified as five separate
#                    columns, and `--check` fails when the committed document drifts. It
#                    never prints a setting's value -- names, characterizations and hosts
#                    only -- because the generated file is committed and several of those
#                    settings are credentials.
#   secret-scan   -- tracker AU-13: gitleaks scans the full git history. `.gitleaks.toml`
#                    extends gitleaks' default ruleset with one narrow, path-based allowlist
#                    for three test files' synthetic connector-auth fixtures (fake tokens
#                    used to test DSN parsing); nothing else is excluded.
#   docker-build  -- tracker AU-13: the audit found the Dockerfile was never built in CI, so
#                    a broken image was only ever found at deploy. This job runs a real
#                    `docker build` and a smoke import inside the built image. Since
#                    review-2026-09-05 §7 it also proves the image ships every package the
#                    wheel manifest declares -- `pyproject.toml` listed `sdk/aida_tool_sdk`
#                    while the Dockerfile copied only `src`, and hatchling's editable install
#                    silently skipped the missing root, so the build went green and
#                    `import aida_tool_sdk` failed at runtime.
#   ui-proxy      -- review-2026-09-05 F07: `AgentGatewayScreen` advertises
#                    `${location.origin}/mcp`, vite proxied `/mcp` in dev, and production
#                    nginx proxied only `/v1/` -- so the URL an engineer copied out of the
#                    deployed UI returned the SPA's index.html instead of the MCP server. No
#                    gate could see it, because both files were individually valid. This job
#                    runs the REAL built ui-next image (nginx + the built SPA) in front of a
#                    stub upstream and asserts each API prefix reaches the upstream while
#                    everything else gets the SPA. `scripts/check_proxy_contract.py` in the
#                    `quality` job is its fast static half; this one is the live test.
#   ui-journey    -- tracker R11-B11: `ui-proxy` proves the proxy routes; this proves the
#                    application works across it. A real browser drives the six-step journey
#                    (connect, scan, describe, review, Ask, evidence) through the REAL nginx
#                    image, each step performed by an identity holding only that step's
#                    roles -- so a step that succeeds proves authorization, not that the
#                    caller was an administrator. It also covers the three cases the row
#                    names as the ones that regress: reload, deep links, and a denied access
#                    that must land on a VISIBLE refusal rather than a blank panel, an empty
#                    state that reads as "no data", or a spinner that never resolves. The
#                    stub upstream's role tuples are copied from the generated
#                    surface-control matrix and `tests/test_journey_stub_contract.py` fails
#                    if they drift, so the permission model under test stays the app's own.
#                    Retries are zero: a browser job retried until green protects nothing.
#   docs          -- review-2026-09-05 D06: README linked a status matrix and a competitor
#                    planning document that did not exist. Every relative link in every
#                    tracked Markdown file must resolve, headings included. External URLs are
#                    never fetched -- a doc gate that flakes on someone else's outage gets
#                    disabled, and a disabled gate proves nothing.
#
# A change that breaks any of these does not merge.

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Fail rather than silently resolving a different dependency set than the lockfile
  # pins. A stale `uv.lock` is itself a CI failure.
  UV_FROZEN: "1"

jobs:
  quality:
    name: Lint, types and architecture
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --extra dev

      - name: ruff
        run: uv run ruff check .

      - name: mypy
        # `sdk/aida_tool_sdk` (TL-5) is checked in the same invocation as `src`
        # rather than separately: run alone it resolves `aida` from the
        # installed (stub-less) package instead of local source and fails
        # with import-untyped errors, since it isn't under `src`.
        run: uv run mypy src sdk/aida_tool_sdk

      - name: import-linter (architecture contracts)
        run: uv run lint-imports

      # The three stdlib-only configuration gates from review-2026-09-05. They
      # need no dependencies at all, so they run here rather than in a job of
      # their own, and they fail fast: each one guards a mismatch between two
      # files that are individually valid.
      - name: Dev/production proxy contract (F07, static)
        run: uv run python scripts/check_proxy_contract.py

      - name: Backend image ships every declared wheel package (REVIEW §7)
        run: uv run python scripts/check_image_packaging.py

  migrations:
    name: Migrations
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Exactly one Alembic head
        run: |
          heads="$(uv run alembic heads)"
          echo "$heads"
          count="$(printf '%s\n' "$heads" | grep -c '(head)' || true)"
          if [ "$count" -ne 1 ]; then
            echo "::error::expected exactly one Alembic head, found $count."
            echo "Two heads means two migrations were authored against the same parent."
            echo "Resolve with a merge revision before this can deploy."
            exit 1
          fi

  openapi-diff:
    name: OpenAPI diff gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # AU-3 (config.py) requires `environment` to be set explicitly outside pytest, so a
    # typo'd variable *name* fails as loudly as a typo'd value. This job invokes a plain
    # script that imports `aida.main` outside pytest, so it needs this set explicitly --
    # scoped to just this job (not the workflow-level env), since `tests/test_config.py`'s
    # own AU-3 coverage relies on `AIDA_ENVIRONMENT` being genuinely absent from the
    # ambient environment to prove the "unset outside tests" failure mode. `development`
    # is correct here: this job only introspects the app's schema, it never deploys.
    env:
      AIDA_ENVIRONMENT: "development"
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Breaking-change check against committed baseline
        run: uv run python scripts/openapi_diff.py

  ui-types-diff:
    name: ui-next OpenAPI type generation gate (UX-14)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Same reason as openapi-diff above: this job imports `aida.main`
    # outside pytest (to generate the OpenAPI schema `generate_ui_types.py`
    # converts to TypeScript) and needs this scoped, job-level env var.
    env:
      AIDA_ENVIRONMENT: "development"
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --extra dev

      - name: ui-next/src/lib/types.ts matches the current OpenAPI schema
        run: uv run python scripts/generate_ui_types.py

  ui-next:
    name: ui-next typecheck, build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ui-next
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: ui-next/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: tsc --noEmit (strict, against the committed generated types)
        run: npm run typecheck

      - name: vitest
        run: npm run test

      - name: vite build
        run: npm run build

  perf-baseline:
    name: Perf regression gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # See the openapi-diff job above: this job also imports `aida.main` outside pytest
    # (to generate the OpenAPI schema as one of its benchmarks) and needs this scoped,
    # job-level env var for the same reason -- not at the workflow level, which would
    # defeat AU-3's own "unset outside tests" test coverage in the `tests` job.
    env:
      AIDA_ENVIRONMENT: "development"
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Benchmark hot paths against committed baseline
        run: uv run python scripts/perf_baseline.py

  quality-baseline:
    name: Quality/accuracy regression gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Same reason as perf-baseline above: this job imports `aida.*` outside pytest
    # and needs this scoped, job-level env var rather than a workflow-level one.
    env:
      AIDA_ENVIRONMENT: "development"
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Retrieval/tool-selection quality against committed baseline
        run: uv run python scripts/quality_benchmark.py

  reachability:
    name: Reachability gate (AU-1)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Every src/aida module reachable from a real entry point, or allow-listed
        run: uv run python -m pytest tests/test_reachability_gate.py -v

  migration-drift:
    name: Migration/ORM drift gate (AU-8)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aida
          POSTGRES_PASSWORD: aida-local-only
          POSTGRES_DB: aida_migration_drift_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AIDA_MIGRATION_DRIFT_TEST_DATABASE_URL: "postgresql+asyncpg://aida:aida-local-only@localhost:5432/aida_migration_drift_test"
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Apply every migration to an empty database and diff against Base.metadata
        run: uv run python -m pytest tests/test_migration_orm_drift.py -v

  connector-version-fixtures:
    name: Connector version fixtures (CN-3)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # tracker CN-3: "at least 2 versions per adapter", against IN-5d's standing
    # gap that no 1.1 discovery statement on any connector had ever run
    # against a live source. Same service-container pattern `migration-drift`
    # above already established, doubled: one container per PostgreSQL major
    # this pass covers (16 -- current default everywhere else in this repo;
    # 14 -- oldest still-supported major), each on its own host port since
    # both live in the same job. See
    # tests/test_postgres_version_fixtures.py's module docstring for the rest
    # of this row's scope (PostgreSQL only this pass; SQL Server/Oracle and
    # the cloud connectors remain) and
    # tests/fixtures/postgres_versions/compose.yml for the equivalent
    # standalone local setup.
    services:
      postgres16:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aida
          POSTGRES_PASSWORD: aida-local-only
          POSTGRES_DB: aida
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      postgres14:
        image: postgres:14-alpine
        env:
          POSTGRES_USER: aida
          POSTGRES_PASSWORD: aida-local-only
          POSTGRES_DB: aida
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AIDA_CN3_POSTGRES16_FIXTURE_DATABASE_URL: "postgresql://aida:aida-local-only@localhost:5432/aida"
      AIDA_CN3_POSTGRES14_FIXTURE_DATABASE_URL: "postgresql://aida:aida-local-only@localhost:5433/aida"
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Discover the real fixture schema against both live Postgres versions
        run: uv run python -m pytest tests/test_postgres_version_fixtures.py -v

  tests:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --extra dev

      - name: pytest (with coverage, AU-14)
        run: >
          uv run pytest
          --cov=aida --cov=atlas
          --cov-report=term-missing
          --cov-report=xml:coverage.xml
          --cov-fail-under=69

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 30

  dependency-scan:
    name: Dependency vulnerability scan + SBOM (AU-13)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Export the locked, non-dev dependency set from uv.lock
        # The same set the Dockerfile now installs (`uv sync --frozen --no-dev`),
        # so this scan and the shipped image can never silently drift apart.
        run: uv export --frozen --no-dev --no-hashes -o requirements-locked.txt

      - name: pip-audit -- full report (uploaded as an artifact, not gating)
        run: uvx --python 3.13 pip-audit -r requirements-locked.txt --format json -o pip-audit-report.json
        continue-on-error: true

      - name: pip-audit -- fail on any unbaselined known vulnerability
        # Gates on any known vulnerability in the locked dependency set that
        # isn't in the baseline below (currently empty -- see history). A new
        # vulnerable package, or a new CVE against an already-pinned one,
        # still fails this job. Re-run the export + unfiltered pip-audit
        # above locally after bumping a package and drop its entries here
        # once the fix lands.
        #
        # 2026-08-31 (AU-13): baselined 16 pre-existing CVEs across
        #   cryptography 45.0.7, pyjwt 2.10.1, pyopenssl 25.3.0 because
        #   bumping them was outside AU-13's file scope.
        # 2026-08-31 (follow-up): bumped cryptography to 50.0.1, PyJWT to
        #   2.13.0, and pyOpenSSL to 26.4.0 (see Docs/60-delivery/03-tracker.md
        #   AU-13 note). That also required bumping snowflake-connector-python
        #   3.15.0 -> 4.4.0, whose <26.0.0 pyopenssl ceiling otherwise made a
        #   fixed pyopenssl unresolvable. A re-run of the unfiltered pip-audit
        #   above found zero remaining known vulnerabilities in the locked
        #   set, so the baseline below is empty; re-add entries here if a
        #   future scan finds something that again can't be fixed in scope.
        run: |
          uvx --python 3.13 pip-audit -r requirements-locked.txt

      - name: Generate CycloneDX SBOM from the locked dependency set
        run: uvx --from cyclonedx-bom cyclonedx-py requirements requirements-locked.txt -o sbom.cdx.json --output-format json

      - name: Upload dependency-scan artifacts (requirements, pip-audit report, SBOM)
        uses: actions/upload-artifact@v4
        with:
          name: dependency-scan-${{ github.sha }}
          path: |
            requirements-locked.txt
            pip-audit-report.json
            sbom.cdx.json
          retention-days: 90

  frontend-dependency-scan:
    name: ui-next dependency vulnerability scan (REVIEW §7)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Deliberately no `npm ci`: `npm audit --package-lock-only` resolves
      # straight from the committed lockfile, so this gate is fast and cannot be
      # blocked by an install problem it has nothing to do with. It is also the
      # set `npm ci` would install, so the two cannot drift.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # THERE IS NO LONGER A BASELINE. It was 14 advisories on 2026-09-06 and 6
      # after vite was pinned to 5.4.21 on 2026-09-11; on 2026-09-12 (R11-D13)
      # the vitest 2.1.9 -> 5.0.0 upgrade -- which forces vite -> 7.3.6 and
      # @vitejs/plugin-react -> 5.2.0 -- fixed the remaining six outright, and
      # `scripts/check_npm_audit.py` now ships an empty `BASELINE` with the
      # advisory-by-advisory record of what cleared and in which version.
      # The comment this replaces predicted the fix as "vite 5 -> 7 and
      # vitest 2 -> 3"; it was vitest 2 -> 5, and the 795-test suite needed no
      # change across all three majors.
      #
      # `ui-next` is therefore held to the same zero-exception rule the `e2e`
      # lockfile always was: ANY advisory fails this job, in either scope, at
      # any severity. Nothing is excepted, so there is nothing to keep current.
      #
      # One constraint the upgrade introduced, since nothing else in the repo
      # records it: vitest 5 requires Node ^22.12 || ^24 || >=26. The
      # `node-version: "22"` above satisfies it only because setup-node
      # resolves the newest 22.x; pinning any 22.x below 22.12 would break the
      # `frontend` and `ui-journey` jobs.
      #
      # A NEW advisory, a new vulnerable package, an advisory that reaches a
      # runtime dependency, or a baseline entry that no longer applies all fail
      # this job.
      - name: npm audit -- fail on any unbaselined advisory
        run: python scripts/check_npm_audit.py --check --report npm-audit-report.json

      - name: Upload npm audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-report-${{ github.sha }}
          path: npm-audit-report.json
          retention-days: 90

  frontend-reachability:
    name: ui-next reachability gate (REVIEW §7)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # Standard library only and no `npm ci` -- same reasoning as the `docs`
      # job below. The walker reads TypeScript as text; it needs no toolchain.
      - name: Every ui-next/src module reachable from a real entry point
        run: python scripts/check_frontend_reachability.py --check

  destination-inventory:
    name: Destination and credential inventory (REVIEW §6.7)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Same reason as openapi-diff: this job imports `atlas.platform.config`
    # outside pytest and needs the scoped, job-level env var rather than a
    # workflow-level one, which would defeat AU-3's own "unset outside tests"
    # coverage in the `tests` job.
    env:
      AIDA_ENVIRONMENT: "development"
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --extra dev

      # Only the inventory is gated here. `generate_surface_control_matrix.py`
      # has a `--check` mode too and is not wired into CI; adding it is a
      # separate decision (it derives from the live FastAPI app, so it drifts
      # whenever a route changes) and belongs to whoever owns that document.
      - name: Docs/50-security inventory matches Settings
        run: uv run python scripts/generate_destination_inventory.py --check

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks scans the full git history, not just the checked-out tree

      - name: Install gitleaks
        run: |
          curl -sSL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          chmod +x gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks

      - name: gitleaks detect
        # .gitleaks.toml extends the default ruleset with one narrow,
        # path-based allowlist for three test files' synthetic connector-auth
        # fixtures; every other rule, and every other path, stays live.
        run: gitleaks detect --source . --config .gitleaks.toml --redact --no-banner --report-format json --report-path gitleaks-report.json

      - name: Upload gitleaks report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report-${{ github.sha }}
          path: gitleaks-report.json
          retention-days: 90

  docker-build:
    name: Docker image build (AU-13)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: docker build
        run: docker build --tag aida:${{ github.sha }} .

      - name: Smoke check -- the built image can actually import the app
        run: docker run --rm -e AIDA_ENVIRONMENT=development aida:${{ github.sha }} python -c "import aida.main; print('aida.main import OK:', aida.main.app)"

      # review-2026-09-05 §7. `scripts/check_image_packaging.py` (quality job)
      # proves the Dockerfile COPYs every declared wheel package; this proves the
      # resulting image can import them. Both are needed: the manifest mismatch
      # that started this did not fail the build, it produced a green image whose
      # `import aida_tool_sdk` raised ModuleNotFoundError.
      - name: Smoke check -- every declared wheel package imports from the image
        run: |
          docker run --rm -e AIDA_ENVIRONMENT=development aida:${{ github.sha }} python -c "
          import aida, atlas, aida_tool_sdk
          for module in (aida, atlas, aida_tool_sdk):
              print(f'{module.__name__} import OK: {module.__file__}')
          "

  ui-proxy:
    name: Production proxy contract, live (F07)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # The real image: nginx serving the real built SPA with the real
      # ui-next/nginx.conf. Not a hand-written nginx config for the test -- that
      # would prove something about a file nobody deploys.
      - name: Build the ui-next image
        run: docker build --tag ui-next:${{ github.sha }} ./ui-next

      - name: Create an isolated network
        run: docker network create atlas-proxy-ci

      # nginx.conf resolves the upstream by the name `api` through Docker's
      # embedded DNS (resolver 127.0.0.11), which only exists on a user-defined
      # network -- hence the alias rather than a container name.
      - name: Start the stub upstream as `api`
        run: |
          docker run -d --name atlas-stub-api \
            --network atlas-proxy-ci --network-alias api \
            -v "$PWD/scripts:/srv:ro" \
            python:3.13-slim python /srv/proxy_contract_stub_api.py 8000

      - name: Start the ui-next image in front of it
        run: |
          docker run -d --name atlas-ui-next \
            --network atlas-proxy-ci -p 8099:80 \
            ui-next:${{ github.sha }}

      - name: Wait for nginx
        run: |
          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:8099/health >/dev/null 2>&1; then
              echo "nginx is up"; exit 0
            fi
            sleep 1
          done
          echo "nginx did not become healthy"; docker logs atlas-ui-next; exit 1

      # THE ASSERTION F07 IS ABOUT. Before the fix, `/mcp` returned the SPA
      # shell -- a 200, valid HTML, and completely wrong. A status-code check
      # would have passed. So each case asserts on the body.
      - name: '/mcp reaches the API, not the SPA'
        run: |
          set -euo pipefail
          body=$(curl -fsS -X POST \
            -H 'Authorization: Bearer ci-smoke-token' \
            -H 'Content-Type: application/json' \
            -d '{"jsonrpc":"2.0","id":1,"method":"initialize"}' \
            http://localhost:8099/mcp)
          echo "$body"
          case "$body" in
            *ATLAS-STUB-UPSTREAM*path=/mcp*) ;;
            *) echo "FAIL: /mcp did not reach the upstream"; exit 1 ;;
          esac
          # The bearer token the MCP server requires must survive the proxy hop.
          case "$body" in
            *authorization=present*) ;;
            *) echo "FAIL: nginx dropped the Authorization header"; exit 1 ;;
          esac

      - name: '/v1/ reaches the API'
        run: |
          set -euo pipefail
          body=$(curl -fsS http://localhost:8099/v1/health)
          echo "$body"
          case "$body" in
            *ATLAS-STUB-UPSTREAM*path=/v1/health*) ;;
            *) echo "FAIL: /v1/ did not reach the upstream"; exit 1 ;;
          esac

      # The other direction: over-proxying would break client-side routing, so a
      # deep link must still get the SPA shell.
      - name: 'an SPA route still gets index.html'
        run: |
          set -euo pipefail
          body=$(curl -fsS http://localhost:8099/some/deep/spa/route)
          case "$body" in
            *ATLAS-STUB-UPSTREAM*) echo "FAIL: an SPA route was proxied to the API"; exit 1 ;;
          esac
          case "$body" in
            *"<!doctype html"*|*"<!DOCTYPE html"*) ;;
            *) echo "FAIL: an SPA route did not return the SPA shell"; exit 1 ;;
          esac

      - name: Container logs on failure
        if: failure()
        run: docker logs atlas-ui-next; docker logs atlas-stub-api

      - name: Tear down
        if: always()
        run: |
          docker rm -f atlas-ui-next atlas-stub-api || true
          docker network rm atlas-proxy-ci || true

  # The `ui-proxy` job above proves the proxy ROUTES correctly, with curl.
  # This one drives a real browser through the same proxy and proves the
  # application WORKS across it -- the six journey steps, each performed by an
  # identity holding only that step's roles, plus reload, deep links and a
  # denied access that must land on a visible refusal.
  #
  # Not the Vite dev server, deliberately: base paths, SPA fallback, header
  # forwarding and API routing all differ between it and the nginx image that
  # actually ships, and those differences are what break a deployment.
  ui-journey:
    name: Browser journey through the production proxy (R11-B11)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # The real production image, built for the topology the tracker row
      # names: live data, and an authenticating reverse proxy in front, so the
      # browser asserts no identity of its own (`ui-next/src/lib/appConfig.ts`)
      # and the seat comes from the proxy -- which is what makes six
      # least-privilege identities testable against ONE image.
      - name: Build the ui-next image (live data, proxy auth)
        run: |
          docker build \
            --build-arg VITE_USE_FIXTURES=0 \
            --build-arg VITE_AUTH_MODE=proxy \
            --tag ui-next-journey:${{ github.sha }} ./ui-next

      - name: Create an isolated network
        run: docker network create atlas-journey-ci

      # `--network-alias api` for the same reason as the `ui-proxy` job:
      # nginx.conf resolves the upstream by that name through Docker's
      # embedded DNS. The repository is mounted read-only because the stub
      # synthesises its response bodies from the committed OpenAPI baseline.
      - name: Start the identity-aware stub upstream as `api`
        run: |
          docker run -d --name atlas-journey-stub \
            --network atlas-journey-ci --network-alias api \
            -v "$PWD:/srv:ro" \
            python:3.13-slim python /srv/scripts/journey_stub_api.py 8000

      - name: Start the ui-next image in front of it
        run: |
          docker run -d --name atlas-journey-ui \
            --network atlas-journey-ci -p 8099:80 \
            ui-next-journey:${{ github.sha }}

      # Waits on the whole path the tests use, not just on nginx. `/health` is
      # answered by nginx itself and says nothing about whether the upstream is
      # reachable, so a run that started on it could pay a first-request stall
      # inside the first test instead of here -- which is how a browser suite
      # acquires a mystery timeout. The marker header is proof the request
      # reached the stub rather than the SPA fallback.
      - name: Wait for the proxy AND the upstream behind it
        run: |
          for _ in $(seq 1 60); do
            if curl -fsS -o /dev/null -H 'Cookie: atlas_journey_identity=auditor' \
                 -D - http://localhost:8099/v1/me 2>/dev/null \
                 | grep -qi '^x-atlas-stub-upstream: journey'; then
              echo "the proxy reaches the upstream"; exit 0
            fi
            sleep 1
          done
          echo "the upstream was not reachable through the proxy"
          docker logs atlas-journey-ui
          docker logs atlas-journey-stub
          exit 1

      - name: Install the browser suite
        working-directory: e2e
        run: npm ci

      - name: Install Chromium
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      # `playwright.config.ts` sets `retries: 0`. A browser job that is retried
      # until green protects nothing, so a failure here is a failure of the
      # build and is meant to be read as one.
      - name: Browser journey (six steps, least-privilege identities)
        working-directory: e2e
        env:
          ATLAS_E2E_BASE_URL: http://localhost:8099
        run: npm test

      - name: Upload the Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-journey-report
          path: e2e/playwright-report
          retention-days: 7

      - name: Container logs on failure
        if: failure()
        run: docker logs atlas-journey-ui; docker logs atlas-journey-stub

      - name: Tear down
        if: always()
        run: |
          docker rm -f atlas-journey-ui atlas-journey-stub || true
          docker network rm atlas-journey-ci || true

  docs:
    name: Documentation links (D06)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # Standard library only -- deliberately no `uv sync`, so a broken link is
      # reported in seconds and this gate cannot be blocked by a dependency
      # resolution problem it has nothing to do with.
      - name: Every relative Markdown link resolves
        run: python scripts/check_docs_links.py

      # D03 and §7 of review-2026-09-05: two documents that are derived from the
      # source tree rather than typed. Both are stdlib-only static analysis for
      # the same reason as the link checker -- they must not be blocked by a
      # dependency resolution problem they have nothing to do with. A failure
      # here means the committed file no longer matches the code; regenerate it
      # by running the same script without `--check`.
      - name: Compatibility-shim register matches the source tree (D03)
        run: python scripts/shim_register.py --check

      - name: Architecture map matches the source tree
        run: python scripts/generate_architecture_map.py --check
