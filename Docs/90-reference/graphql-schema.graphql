  objectOkfKnowledge(tableId: ID!): OkfObjectKnowledge

  """One table by id, decided as its columns route decides it."""
  table(id: ID!): Table

  """
  Tables the caller may read. With `datasourceId`, as `GET /v1/datasources/{id}/tables`; without it, across the caller's organization, with unreadable datasources removed before counting and paging.
  """
  tables(datasourceId: ID = null, first: Int! = 20, after: String = null, q: String = null, objectType: String = null, status: String! = "ACTIVE"): TableConnection
}

"""
How completely one routine's body was understood, as last measured -- `GET /v1/datasources/{id}/procedures/{routine_id}/parse-coverage`.
"""
type RoutineParseCoverage {
  routineId: ID!

  """SUPPORTED, PARTIAL or UNAVAILABLE."""
  state: String!
  parseCompleted: Boolean!
  isReadOnly: Boolean!
  statementCount: Int!
  unparsedStatementCount: Int!
  unparsedReasonCodes: [String!]!
  dialect: String!
  confidence: String!
  sourceMappingGranularity: String!
  parsedAt: DateTime!
  memberAttribution: String
  memberFallbackReason: String
}

"""
When a source behind a context product was last read, and last read in full -- an entry of the compile route's `generated_from.source_freshness`.
"""
type SourceFreshness {
  datasourceId: ID!
  tableIds: [ID!]!

  """ISO-8601, exactly as the compile route renders it."""
  lastScanCompletedAt: String
  lastFullScanCompletedAt: String
}

"""A page of source freshness, in datasource id order."""
type SourceFreshnessConnection {
  nodes: [SourceFreshness!]!
  pageInfo: PageInfo!
  totalCount: Int
}

"""A table, view or other relation, as the catalog records it."""
type Table {
  id: ID!
  datasourceId: ID!
  schemaId: ID!
  name: String!
  objectType: String!
  status: String!
  fingerprint: String!

  """The datasource this table belongs to."""
  datasource: DataSource

  """Active columns in ordinal order, as `GET /v1/tables/{id}/columns`."""
  columns(first: Int! = 20, after: String = null): ColumnConnection

  """
  Keys and references, as `GET /v1/tables/{id}/constraints`. A referenced table is authorized on its own.
  """
  constraints(first: Int! = 20, after: String = null): ConstraintConnection

  """The approved description, as `GET /v1/tables/{id}/description`."""
  description: ApprovedTableDescription
}

"""A page of tables."""
type TableConnection {
  nodes: [Table!]!
  pageInfo: PageInfo!

  """
  Computed on the first page only, and only over what the caller may read.
  """
  totalCount: Int
}

"""
How completely one trigger's body was understood, as last measured -- `GET /v1/datasources/{id}/triggers/{trigger_id}/parse-coverage`.
"""
type TriggerParseCoverage {
  triggerId: ID!

  """The routine the body was read from (a PostgreSQL trigger's function)."""
  routineId: ID
  state: String!
  parseCompleted: Boolean!
  isReadOnly: Boolean!
  statementCount: Int!
  unparsedStatementCount: Int!
  unparsedReasonCodes: [String!]!
  dialect: String!
  confidence: String!
  sourceMappingGranularity: String!
  parsedAt: DateTime!
}
