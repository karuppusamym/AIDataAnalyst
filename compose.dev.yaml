# Local development overlay. Keep compose.yaml production-like; opt into this
# file when editing the UI or Python API. ui-next is available separately on
# :5174 with Vite HMR.
services:
  api:
    command: ["uvicorn", "aida.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    volumes:
      - ./src:/app/src
      - ./migrations:/app/migrations
      - ./alembic.ini:/app/alembic.ini:ro

  ui-next:
    build:
      context: ./ui-next
      dockerfile: Dockerfile.dev
    command: ["sh", "-c", "npm ci && npm run dev -- --host 0.0.0.0 --port 5174"]
    depends_on:
      api:
        condition: service_healthy
    environment:
      CHOKIDAR_USEPOLLING: "true"
      VITE_API_PROXY_TARGET: http://api:8000
    # Replace the production image's 3001:80 mapping while this service runs
    # Vite directly on 5174.
    ports: !reset
      - "5174:5174"
    volumes:
      - ./ui-next:/app
      - ui-next-node-modules:/app/node_modules

volumes:
  ui-next-node-modules:
