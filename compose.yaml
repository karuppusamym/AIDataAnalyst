name: aida-platform

# ---------------------------------------------------------------------------
# PROFILES (R11-X9). `docker compose up` starts the ten services the product
# needs: postgres, temporal, migrate, api, ui-next, metadata-worker,
# fleet-scheduler and the three sample-source containers. Everything else is
# opt-in, because with default settings it does nothing:
#
#   cache        redis                         AIDA_LINEAGE_CACHE_ENABLED and
#                                              AIDA_MCP_BUDGET_ENABLED both
#                                              default to false (config.py), so
#                                              nothing in the default stack
#                                              opens a Redis connection.
#   graph        neo4j, graph-projector,       graph_store_backend defaults to
#                redpanda, outbox-publisher    `postgres`, which reads the same
#                                              relational tables and is the
#                                              certified adapter; the neo4j
#                                              adapter is additionally gated by
#                                              AIDA_LINEAGE_NEO4J_READ_ENABLED
#                                              (INV-9/E5 has not run).
#   events       redpanda, redpanda-console,   ~118 event types are produced to
#                outbox-publisher              the outbox table; 8 are consumed,
#                                              by the two projectors above.
#                                              PostgreSQL stays authoritative
#                                              (INV-1), so nothing is lost while
#                                              the transport is down -- the
#                                              outbox simply accumulates.
#   archive      minio                         audit_archive_storage_backend
#                                              defaults to `none`.
#   temporal-ui  temporal-ui                   Developer convenience.
#   full         all of the above              One flag for the 18 services a
#                                              plain `up` used to start
#                                              (excludes `seed`).
#   seed         seed                          Pre-existing; demonstration data.
#
# Nothing here is removed: the Kafka consumers, the Redis-backed MCP limits and
# Temporal itself all remain. This only changes what starts by default.
#
# Compose refuses a project where an ENABLED service `depends_on` a service
# whose profile is not enabled ("depends on undefined service"), which is why
# `api` no longer lists `redis` and why `redpanda`/`outbox-publisher` carry both
# the `events` and `graph` profiles -- `graph-projector` is Kafka-driven and
# needs a publisher feeding it, so `--profile graph` has to be self-contained.
#
#   docker compose up -d --build                        # default stack
#   docker compose --profile cache up -d                # + Redis
#   docker compose --profile graph up -d                # + Neo4j projection
#   docker compose --profile events up -d               # + Kafka transport
#   docker compose --profile archive up -d              # + MinIO
#   docker compose --profile temporal-ui up -d          # + Temporal Web UI
#   docker compose --profile full up -d --build         # everything
#
# The feature flags below follow the profiles: enabling `cache` or `graph` also
# means setting the matching AIDA_* variable, which is why each one is now read
# from the environment with an off default instead of being hard-coded to true.
# ---------------------------------------------------------------------------

# Every AIDA_* setting in `.env` reaches the app services, and the explicit
# `environment` block below still wins for anything it names.
#
# Without this, a setting the documentation tells an operator to put in `.env`
# silently did nothing in Docker: only the ~35 names listed below were
# forwarded, so `AIDA_DELIVERY_WORKER_ENABLED`, the governance-notification
# flag, the webhook URLs, the reviewer-agent controls and every task agent's
# interval were read from a file the container could not see. The features
# looked broken and the configuration looked correct, which is the worst
# possible pairing.
#
# `required: false` so a fresh clone with no `.env` still starts.
#
# The precedence is what makes this safe -- Compose lets `environment`
# override `env_file`, and every container-internal address below is named
# there: `AIDA_DATABASE_URL`, `AIDA_REDIS_URL`, `AIDA_KAFKA_BOOTSTRAP_SERVERS`,
# `AIDA_TEMPORAL_ADDRESS` and the object-store trio all point at service
# hostnames, while a developer's `.env` points the same names at localhost for
# host-side scripts. `tests/test_compose_environment.py` pins that every one of
# them stays explicit, because removing one from the block below would silently
# let a localhost value take over inside the container.
x-app-env-file: &app-env-file
  - path: .env
    required: false

x-app-environment: &app-environment
  AIDA_ENVIRONMENT: development
  AIDA_LOG_LEVEL: INFO
  AIDA_DATABASE_URL: postgresql+asyncpg://aida:aida-local-only@postgres:5432/aida
  AIDA_TEMPORAL_ADDRESS: temporal:7233
  AIDA_TEMPORAL_NAMESPACE: default
  AIDA_TEMPORAL_TASK_QUEUE: aida-metadata
  AIDA_REDIS_URL: redis://redis:6379/0
  # Off by default, matching `Settings` in atlas/platform/config.py and
  # `.env.example`, so the default stack never reaches for a service it does
  # not start. Turn them on together with the profile that provides the
  # backing service -- see the PROFILES block at the top of this file:
  #   AIDA_LINEAGE_CACHE_ENABLED=true  docker compose --profile cache up -d
  #   AIDA_MCP_BUDGET_ENABLED=true     docker compose --profile cache up -d
  #   AIDA_LINEAGE_NEO4J_READ_ENABLED=true docker compose --profile graph up -d
  AIDA_LINEAGE_CACHE_ENABLED: ${AIDA_LINEAGE_CACHE_ENABLED:-false}
  AIDA_LINEAGE_NEO4J_READ_ENABLED: ${AIDA_LINEAGE_NEO4J_READ_ENABLED:-false}
  AIDA_MCP_BUDGET_ENABLED: ${AIDA_MCP_BUDGET_ENABLED:-false}
  AIDA_NEO4J_URI: bolt://neo4j:7687
  AIDA_NEO4J_USER: neo4j
  AIDA_NEO4J_PASSWORD: aida-local-only
  AIDA_KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
  AIDA_OBJECT_STORE_ENDPOINT: http://minio:9000
  AIDA_OBJECT_STORE_ACCESS_KEY: aida
  AIDA_OBJECT_STORE_SECRET_KEY: aida-local-only
  AIDA_AUDIT_HMAC_KEY: local-development-audit-hmac-key-only
  AIDA_SAMPLE_SOURCE_DSN: postgresql://source:source-local-only@sample-source:5432/bank_demo
  AIDA_SAMPLE_RISK_SOURCE_DSN: postgresql://source:source-local-only@sample-source:5432/risk_demo
  AIDA_SAMPLE_MSSQL_SOURCE_DSN: mssql://source:S0urce!LocalOnly1@sample-mssql-source:1433/bank_demo_mssql
  AIDA_MODEL_GENERATION_ENABLED: ${AIDA_MODEL_GENERATION_ENABLED:-false}
  AIDA_MODEL_ROUTE: ${AIDA_MODEL_ROUTE:-openai-bank-sql}
  AIDA_MODEL_ROUTE_FALLBACKS: ${AIDA_MODEL_ROUTE_FALLBACKS:-}
  AIDA_OPENAI_BASE_URL: ${AIDA_OPENAI_BASE_URL:-https://api.openai.com/v1}
  AIDA_GEMINI_BASE_URL: ${AIDA_GEMINI_BASE_URL:-https://generativelanguage.googleapis.com/v1beta}
  AIDA_MODEL_PROVIDER_MAX_ATTEMPTS: ${AIDA_MODEL_PROVIDER_MAX_ATTEMPTS:-3}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  # Embeddings were reachable from a host process and from nothing in a
  # container: the generation settings above were passed through and the
  # `AIDA_EMBEDDING_*` ones were not, so `embedding_provider` read `unset`
  # inside `api` however the host was configured, and the vector stage
  # skipped itself with a reason nobody would connect to a missing compose
  # entry. Defaults preserve the shipped posture exactly -- `unset` still
  # means unset, and the stage still refuses rather than guessing.
  AIDA_EMBEDDING_PROVIDER: ${AIDA_EMBEDDING_PROVIDER:-unset}
  AIDA_EMBEDDING_CREDENTIAL_REFERENCE: ${AIDA_EMBEDDING_CREDENTIAL_REFERENCE:-}
  AIDA_EMBEDDING_MODEL_ID: ${AIDA_EMBEDDING_MODEL_ID:-unset}
  AIDA_EMBEDDING_MODEL_VERSION: ${AIDA_EMBEDDING_MODEL_VERSION:-unset}
  AIDA_EMBEDDING_DIMENSIONS: ${AIDA_EMBEDDING_DIMENSIONS:-768}
  AIDA_VECTOR_INDEX_REBUILD_ENABLED: ${AIDA_VECTOR_INDEX_REBUILD_ENABLED:-true}

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: aida
      POSTGRES_PASSWORD: aida-local-only
      POSTGRES_DB: aida
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aida -d aida"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # Opt-in: `--profile cache`. Backs `aida/lineage_cache.py` and
  # `aida/mcp_budget.py` only, both of which are off by default. The MCP rate
  # limits themselves are unchanged and still enforced whenever
  # AIDA_MCP_BUDGET_ENABLED is true -- this profile decides whether the store
  # they need is running, not whether the limits exist.
  redis:
    profiles: ["cache", "full"]
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # Opt-in: `--profile graph`. The default graph backend is `postgres`
  # (`Settings.graph_store_backend`), which is the adapter the conformance
  # suite certifies; the neo4j adapter is additionally gated by
  # AIDA_LINEAGE_NEO4J_READ_ENABLED because INV-9/E5 (the projection rebuild
  # drill) has not run. Nothing in the default stack dials bolt://neo4j:7687.
  neo4j:
    profiles: ["graph", "full"]
    image: neo4j:5.26-community
    environment:
      NEO4J_AUTH: neo4j/aida-local-only
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  temporal:
    image: temporalio/auto-setup:1.28.1
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: aida
      POSTGRES_PWD: aida-local-only
      POSTGRES_SEEDS: postgres
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/docker.yaml
    ports:
      - "7233:7233"
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "temporal:7233"]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  # Opt-in: `--profile temporal-ui`. A developer convenience only -- Temporal
  # itself (above) stays in the default stack because the platform's durable
  # workflows depend on it.
  temporal-ui:
    profiles: ["temporal-ui", "full"]
    image: temporalio/ui:2.40.1
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:3000
    ports:
      - "8080:8080"
    restart: unless-stopped

  # Opt-in: `--profile events`, and also under `--profile graph` because
  # `graph-projector` is a Kafka consumer and Compose will not resolve a
  # dependency whose own profile is disabled. Events are written to the
  # `outbox_event` table regardless; without this transport they accumulate
  # there as PENDING, which is the designed behaviour (PostgreSQL is
  # authoritative, INV-1) and is drained once the profile is enabled.
  redpanda:
    profiles: ["events", "graph", "full"]
    image: redpandadata/redpanda:v25.1.3
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp=1
      - --memory=768M
      - --reserve-memory=0M
      - --node-id=0
      - --check=false
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
    ports:
      - "19092:19092"
      - "9644:9644"
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  # Opt-in: `--profile events`. Inspection UI only; nothing consumes from it,
  # so it is deliberately not pulled in by `--profile graph`.
  redpanda-console:
    profiles: ["events", "full"]
    image: redpandadata/console:v2.8.5
    depends_on:
      redpanda:
        condition: service_healthy
    environment:
      KAFKA_BROKERS: redpanda:9092
    ports:
      - "8081:8080"
    restart: unless-stopped

  # Opt-in: `--profile archive`. `audit_archive_storage_backend` defaults to
  # `none` (`NullArchiveStorage`, which refuses rather than reporting success),
  # so the default stack has no archive destination and this service has no
  # client. Turn it on together with AIDA_AUDIT_ARCHIVE_STORAGE_BACKEND=s3.
  #
  # Version pinned, not `:latest` (the k8s base deployment already calls the
  # floating tag out as an audit finding). This is the release that the
  # 2026-09-09 Object Lock evidence in the capability register was produced
  # against; bump it deliberately, not by pulling.
  minio:
    profiles: ["archive", "full"]
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: aida
      MINIO_ROOT_PASSWORD: aida-local-only
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  sample-source:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: source
      POSTGRES_PASSWORD: source-local-only
      POSTGRES_DB: bank_demo
    ports:
      - "55432:5432"
    volumes:
      - sample-source-data:/var/lib/postgresql/data
      - ./infra/sample-source/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U source -d bank_demo"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  sample-mssql-source:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Source-Local-Only1"
      MSSQL_PID: "Developer"
    ports:
      - "14330:1433"
    volumes:
      - sample-mssql-source-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "(/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\" || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\") || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  sample-mssql-source-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    depends_on:
      sample-mssql-source:
        condition: service_healthy
    volumes:
      - ./infra/sample-mssql-source/init.sql:/init.sql:ro
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        if [ -x /opt/mssql-tools18/bin/sqlcmd ]; then
          SQLCMD="/opt/mssql-tools18/bin/sqlcmd -b -C -S sample-mssql-source -U sa -P Source-Local-Only1"
        else
          SQLCMD="/opt/mssql-tools/bin/sqlcmd -b -S sample-mssql-source -U sa -P Source-Local-Only1"
        fi
        $$SQLCMD -d master -Q "IF DB_ID(N'bank_demo_mssql') IS NULL CREATE DATABASE bank_demo_mssql"
        $$SQLCMD -d bank_demo_mssql -i /init.sql
        $$SQLCMD -d master -Q "IF SUSER_ID(N'source') IS NULL CREATE LOGIN source WITH PASSWORD = N'S0urce!LocalOnly1'"
        $$SQLCMD -d bank_demo_mssql -Q "IF USER_ID(N'source') IS NULL CREATE USER source FOR LOGIN source; ALTER ROLE db_datareader ADD MEMBER source; GRANT SHOWPLAN TO source;"
    restart: "no"

  migrate:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    env_file: *app-env-file
    environment: *app-environment
    # This repository intentionally has independent Alembic branches. `heads`
    # upgrades each of them; `head` fails as soon as more than one branch exists.
    command: ["alembic", "upgrade", "heads"]
    restart: "no"

  api:
    build: .
    # No `redis` edge (R11-X9). Redis is behind `--profile cache`, and Compose
    # rejects the whole project -- "service api depends on undefined service
    # redis" -- if an enabled service depends on a service whose profile is
    # off. The edge was not load-bearing either way: both Redis consumers are
    # lazy and fail soft (`LineageCache` catches RedisError and returns a miss;
    # the MCP budget degrades), so the API does not need Redis to be up first
    # even when `--profile cache` is enabled.
    depends_on:
      migrate:
        condition: service_completed_successfully
      temporal:
        condition: service_healthy
    env_file: *app-env-file
    environment: *app-environment
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live')"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  ui-next:
    build:
      context: ./ui-next
      args:
        VITE_USE_FIXTURES: ${UI_NEXT_USE_FIXTURES:-0}
        VITE_DEV_PRINCIPAL_ID: ${UI_NEXT_DEV_PRINCIPAL_ID:-local-ui-admin}
        VITE_DEV_ROLES: ${UI_NEXT_DEV_ROLES:-}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3001:80"
    restart: unless-stopped

  # Opt-in demonstration seed. Runs only when explicitly requested:
  #   docker compose --profile seed run --rm seed
  # It populates a value-free sample banking estate through the API so the
  # catalog, knowledge graph and unified lineage render non-empty on a fresh
  # install. Never enabled by a plain `docker compose up`.
  seed:
    build: .
    profiles: ["seed"]
    depends_on:
      api:
        condition: service_healthy
    env_file: *app-env-file
    environment:
      <<: *app-environment
      AIDA_BASE_URL: http://api:8000
    volumes:
      - ./scripts:/app/scripts:ro
    command: ["python", "scripts/seed_sample_estate.py"]
    restart: "no"

  metadata-worker:
    build: .
    depends_on:
      migrate:
        condition: service_completed_successfully
      temporal:
        condition: service_healthy
      sample-source:
        condition: service_healthy
    env_file: *app-env-file
    environment: *app-environment
    command: ["python", "-m", "aida.workflows.worker"]
    restart: unless-stopped

  fleet-scheduler:
    build: .
    depends_on:
      migrate:
        condition: service_completed_successfully
      temporal:
        condition: service_healthy
    env_file: *app-env-file
    environment: *app-environment
    command: ["python", "-m", "aida.workflows.scheduler"]
    restart: unless-stopped

  # Opt-in: `--profile events`, and under `--profile graph` because it is what
  # feeds `graph-projector`. The publisher is unchanged and still relays every
  # outbox row; only its start condition moved.
  outbox-publisher:
    profiles: ["events", "graph", "full"]
    build: .
    depends_on:
      migrate:
        condition: service_completed_successfully
      redpanda:
        condition: service_healthy
    env_file: *app-env-file
    environment: *app-environment
    command: ["python", "-m", "aida.projectors.outbox_publisher"]
    restart: unless-stopped

  # Opt-in: `--profile graph`. Both consumers it implements are retained; the
  # profile only decides whether they are running. The default stack serves
  # graph reads from the `postgres` backend instead.
  graph-projector:
    profiles: ["graph", "full"]
    build: .
    depends_on:
      migrate:
        condition: service_completed_successfully
      redpanda:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    env_file: *app-env-file
    environment: *app-environment
    command: ["python", "-m", "aida.projectors.graph_projector"]
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  neo4j-data:
  redpanda-data:
  minio-data:
  sample-source-data:
  sample-mssql-source-data:
