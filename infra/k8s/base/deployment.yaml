# aida-api Deployment.
#
# Image: NEVER a floating tag (audit finding: compose.yaml/minio uses
# `:latest`, called out explicitly as an anti-pattern). The `@sha256:...`
# digest below is a placeholder -- see the "Image digest" section of
# infra/k8s/README.md for how a real CI/CD pipeline is expected to
# populate it (build once, digest-pin everywhere, no tags in this file).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aida-api
  namespace: aida
  labels:
    app.kubernetes.io/name: aida-api
    app.kubernetes.io/part-of: aida-platform
spec:
  replicas: 3
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: aida-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aida-api
        app.kubernetes.io/part-of: aida-platform
    spec:
      serviceAccountName: aida-api
      automountServiceAccountToken: false
      # Pod-level security context: belt-and-suspenders with the
      # container-level one below. runAsUser/Group 10001 matches the
      # `aida` user the Dockerfile creates and switches to (`USER aida`,
      # uid/gid 10001) -- a non-root pod spec is meaningless against an
      # image that still runs as root, so these two files must agree.
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: aida-api
          # PLACEHOLDER -- see infra/k8s/README.md "Image digest". Never
          # replace the digest with a bare tag or `:latest`.
          image: "REPLACE_ME_REGISTRY/aida-api@sha256:REPLACE_ME_WITH_REAL_DIGEST"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: aida-api-config
            - secretRef:
                name: aida-api-secrets
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            capabilities:
              drop: ["ALL"]
          # Tunable defaults, not measured limits -- no load testing has
          # been run against this codebase (see audit §5: no coverage or
          # perf numbers exist yet). Start here, watch actual usage in
          # staging, and adjust. Requests == a safe floor for a FastAPI +
          # SQLAlchemy async process at idle; limits give headroom for
          # request bursts before OOMKill.
          resources:
            requests:
              cpu: "250m"
              memory: "384Mi"
            limits:
              cpu: "1"
              memory: "768Mi"
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        # readOnlyRootFilesystem above needs a writable /tmp; the app
        # itself does not persist anything to disk (audited: no
        # tempfile/open(..., "w") calls in src/aida or src/atlas), this is
        # defensive only, for libraries that assume a writable /tmp.
        - name: tmp
          emptyDir: {}
