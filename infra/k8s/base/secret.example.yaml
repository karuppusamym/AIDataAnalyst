# TEMPLATE ONLY -- do not `kubectl apply -f` this file as-is, and do not
# fill in real values and commit them. It exists to document exactly which
# keys `aida-api-secrets` must contain and is deliberately left out of
# kustomization.yaml so `kubectl apply -k` never applies fake credentials.
#
# In a real deployment, populate the Secret named `aida-api-secrets` in the
# `aida` namespace by one of:
#   - `kubectl create secret generic aida-api-secrets --from-literal=... `
#   - a secrets operator (External Secrets Operator, Sealed Secrets, the
#     Vault Agent Injector, etc.) reading from your actual secret store --
#     preferred, since it means no plaintext ever touches a manifest or CI
#     log.
#
# Every key below is read as `AIDA_<UPPER_SNAKE_FIELD_NAME>` by
# `src/atlas/platform/config.py`'s Settings (env_prefix="AIDA_"), except
# OPENAI_API_KEY / GEMINI_API_KEY, which use validation_alias and are read
# unprefixed.
apiVersion: v1
kind: Secret
metadata:
  name: aida-api-secrets
  namespace: aida
type: Opaque
stringData:
  # Full DSN including credentials.
  AIDA_DATABASE_URL: "postgresql+asyncpg://REPLACE_ME_USER:REPLACE_ME_PASSWORD@REPLACE_ME_HOST:5432/aida"
  # Redis is used for caching/rate limiting; include auth if your Redis
  # requires it (e.g. "redis://:REPLACE_ME_PASSWORD@host:6379/0").
  AIDA_REDIS_URL: "redis://REPLACE_ME_HOST:6379/0"
  AIDA_NEO4J_PASSWORD: "REPLACE_ME"
  AIDA_OBJECT_STORE_ACCESS_KEY: "REPLACE_ME"
  AIDA_OBJECT_STORE_SECRET_KEY: "REPLACE_ME"

  # QG-5/QG-6: even with a KMS-backed signer configured, Settings'
  # production validator still requires these two fields to independently
  # be >= 32 characters (see reject_insecure_production_configuration).
  # Generate with e.g. `openssl rand -base64 32` and never reuse across
  # environments.
  AIDA_AUDIT_HMAC_KEY: "REPLACE_ME_32_PLUS_RANDOM_CHARACTERS"
  AIDA_TOKENIZATION_KEY: "REPLACE_ME_32_PLUS_RANDOM_CHARACTERS"

  # Vault auth token *references* resolved through the same SecretResolver
  # path as everything else (see aida/secrets.py) -- not the raw Vault
  # token itself. Populate only if your Vault deployment expects a static
  # reference here rather than Kubernetes auth / Agent Injector.
  AIDA_HMAC_SIGNING_VAULT_TOKEN_REFERENCE: ""
  AIDA_TOKENIZATION_VAULT_TOKEN_REFERENCE: ""

  # Only needed if AIDA_MODEL_GENERATION_ENABLED=true in the ConfigMap.
  OPENAI_API_KEY: ""
  GEMINI_API_KEY: ""
