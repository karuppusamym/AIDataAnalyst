# Dedicated identity for the aida-api pods. The API does not call the
# Kubernetes API itself, so the token is not mounted (least privilege).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: aida-api
  namespace: aida
  labels:
    app.kubernetes.io/name: aida-api
    app.kubernetes.io/part-of: aida-platform
automountServiceAccountToken: false
