# GENERATED by scripts/generate_prometheus_rule.py -- do not edit by hand.
#
# The source of truth is infra/monitoring/prometheus/rules/atlas.rules.yml, and
# it is the copy to read: every placeholder threshold in this file is explained
# in a comment there, and YAML comments do not survive the parse that produced
# this resource. Edit that file and re-run the generator;
# tests/test_monitoring_rules.py fails when this copy is stale.
#
# Requires the Prometheus Operator CRDs (monitoring.coreos.com/v1). On a cluster
# without them, mount the source file into a plain Prometheus instead -- see
# ../README.md.
#
# Every alert below carries a `threshold_status` label: `structural` means the
# comparison needed no magnitude anybody had to choose, `placeholder` means the
# number is a documented starting point an operator must replace. No latency or
# backlog magnitude in this file is a measurement of this platform.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: aida-platform
  namespace: aida
  labels:
    app.kubernetes.io/name: aida-platform
    app.kubernetes.io/part-of: aida-platform
    release: REPLACE_ME_PROMETHEUS_RELEASE_LABEL
spec:
  groups:
  - name: atlas.recording
    interval: 30s
    rules:
    - record: atlas:http_server_error_ratio:rate15m
      expr: |
        sum(rate(aida_http_requests_total{status=~"5.."}[15m]))
          / sum(rate(aida_http_requests_total[15m]))
    - record: atlas:retrieval_duration_seconds:p95_10m
      expr: |
        histogram_quantile(
          0.95,
          sum by (le) (rate(aida_retrieval_duration_seconds_bucket[10m]))
        )
    - record: atlas:http_request_duration_seconds:p95_10m
      expr: |
        histogram_quantile(
          0.95,
          sum by (le) (rate(aida_http_request_duration_seconds_bucket[10m]))
        )
    - record: atlas:model_tokens_reported_share:rate1h
      expr: |
        sum(rate(aida_model_call_tokens_total{basis="REPORTED"}[1h]))
          / sum(rate(aida_model_call_tokens_total[1h]))
  - name: atlas.scrape-health
    rules:
    - alert: AtlasTargetDown
      expr: up{job=~"atlas-.*"} == 0
      for: 5m
      labels:
        severity: critical
        threshold_status: structural
      annotations:
        summary: Atlas target {{ $labels.job }} is not answering scrapes
        description: 'Prometheus has failed to scrape this target for five minutes. For atlas-fleet-scheduler,
          atlas-graph-projector and atlas-metadata-worker the first thing to check is not the process
          but the configuration: those three expose no HTTP surface unless AIDA_WORKER_METRICS_PORT is
          set, so a target that has never come up is far more likely unset than down.'
        runbook: infra/monitoring/README.md
    - alert: AtlasFootprintMetricsAbsent
      expr: absent(aida_footprint_metrics_organizations)
      for: 15m
      labels:
        severity: warning
        threshold_status: structural
      annotations:
        summary: The footprint metrics pass is publishing nothing
        description: aida_footprint_metrics_organizations is absent from every scraped target. Either
          the fleet scheduler is not being scraped, or footprint_metrics_enabled was turned off. While
          this fires every other footprint rule here is silent for want of data, which is the failure
          footprint_metrics.py publishes zeros to avoid -- so treat it as the same class of incident as
          a growing backlog.
        runbook: infra/monitoring/README.md
    - alert: AtlasFootprintSweepReadNoOrganizations
      expr: aida_footprint_metrics_organizations == 0
      for: 15m
      labels:
        severity: warning
        threshold_status: structural
      annotations:
        summary: The footprint sweep read zero organizations
        description: The pass ran and either every organization's read failed or there are no ACTIVE organizations.
          Every gap gauge is therefore zero for a reason that is not "the queues are empty". The footprint_metrics_organization_failed
          structlog line names the organizations that failed.
        runbook: infra/monitoring/README.md
  - name: atlas.footprint
    rules:
    - alert: AtlasLineageParseBacklogNotDraining
      expr: |
        deriv(aida_footprint_gaps{kind="LINEAGE_AWAITING_PARSE"}[6h]) > 0
          and aida_footprint_gaps{kind="LINEAGE_AWAITING_PARSE"} > 0
      for: 1h
      labels:
        severity: warning
        threshold_status: structural
      annotations:
        summary: The lineage agent's parse backlog has been growing for six hours
        description: Eligible views and routines are arriving faster than the lineage agent is parsing
          them. The usual cause is that the agent is not scheduled at all -- lineage_agent_interval_minutes
          ships at 0 -- in which case this is configuration, not capacity. Fleet-wide only; see this file's
          header for why it cannot name the tenant.
        runbook: infra/monitoring/README.md
    - alert: AtlasLineageReviewBacklogNotDraining
      expr: |
        deriv(aida_footprint_gaps{kind="LINEAGE_AWAITING_REVIEW"}[12h]) > 0
          and aida_footprint_gaps{kind="LINEAGE_AWAITING_REVIEW"} > 0
      for: 2h
      labels:
        severity: info
        threshold_status: structural
      annotations:
        summary: The lineage review queue has been growing for twelve hours
        description: 'Proposed lineage is being filed faster than stewards are deciding it. Not a platform
          fault and deliberately info severity: the fix is review capacity or a narrower proposal scope,
          not a restart.'
        runbook: infra/monitoring/README.md
    - alert: AtlasSourceChangeHoldsRising
      expr: |
        deriv(aida_footprint_gaps{kind="SOURCE_CHANGE_HOLDS"}[6h]) > 0
          and aida_footprint_gaps{kind="SOURCE_CHANGE_HOLDS"} > 0
      for: 1h
      labels:
        severity: warning
        threshold_status: structural
      annotations:
        summary: Source-change holds are accumulating
        description: A hold suspends the governed tools over the object it covers, so a rising count means
          a widening set of tools is refusing to answer. Each hold needs a steward decision; they do not
          expire.
        runbook: infra/monitoring/README.md
    - alert: AtlasChangeSignalQueueStale
      expr: aida_footprint_oldest_pending_change_signal_seconds > 3600
      for: 15m
      labels:
        severity: warning
        threshold_status: placeholder
      annotations:
        summary: The oldest unprocessed source-change signal has waited over the placeholder age
        description: 'Age, not depth, is the signal: a deep queue that is draining is healthy, and a shallow
          queue whose oldest row is hours old means nothing is moving. The 3600s in this rule is a documented
          placeholder, not a measured or agreed number -- see the comment above this rule for how to choose
          the estate''s own value, and treat a firing instance as "nobody has set this yet" until it is
          replaced.'
        runbook: infra/monitoring/README.md
    - alert: AtlasChangeSignalQueueHeadNotMoving
      expr: |
        deriv(aida_footprint_oldest_pending_change_signal_seconds[1h]) > 0
          and aida_footprint_oldest_pending_change_signal_seconds > 0
      for: 30m
      labels:
        severity: warning
        threshold_status: structural
      annotations:
        summary: The oldest pending change signal keeps getting older
        description: 'The head of the change-signal queue is not being consumed. Needs no threshold: the
          oldest entry ageing monotonically is the definition of a queue that is not moving, whatever
          the estate''s tolerance for depth. Check that change_signal_processing_interval_minutes is non-zero
          and that the fleet scheduler is alive.'
        runbook: infra/monitoring/README.md
    - alert: AtlasQuarantinedCodeRising
      expr: |
        deriv(aida_footprint_gaps{kind="CODE_QUARANTINED"}[6h]) > 0
          and aida_footprint_gaps{kind="CODE_QUARANTINED"} > 0
      for: 1h
      labels:
        severity: info
        threshold_status: structural
      annotations:
        summary: Prompt-risk screening is quarantining more captured code
        description: Nothing reads quarantined code for lineage, tools or model context until a steward
          clears it, so a rising count silently narrows what the platform can explain. A sharp rise is
          also worth reading as a screening-rule change rather than a source change.
        runbook: infra/monitoring/README.md
  - name: atlas.projection
    rules:
    - alert: AtlasProjectionStalled
      expr: |
        sum(rate(aida_graph_projection_rows_total[30m])) == 0
          and aida_graph_projection_backlog_events > 0
      for: 30m
      labels:
        severity: critical
        threshold_status: structural
      annotations:
        summary: The graph projector is holding a backlog and writing nothing
        description: Events are buffered in the fair-share scheduler and no hierarchy level has been written
          for half an hour. The knowledge graph is frozen while the API keeps answering, which is the
          silent-failure shape this rule exists for.
        runbook: infra/monitoring/README.md
    - alert: AtlasProjectionBacklogGrowing
      expr: |
        deriv(aida_graph_projection_backlog_events[1h]) > 0
          and aida_graph_projection_backlog_events > 0
      for: 30m
      labels:
        severity: warning
        threshold_status: structural
      annotations:
        summary: The graph projector's buffer has been filling for an hour
        description: Arrival is outrunning projection. Once the buffer is full the projector applies backpressure
          and drains rather than dropping, so this degrades freshness before it degrades correctness --
          but it is the leading indicator for the lag alert below.
        runbook: infra/monitoring/README.md
    - alert: AtlasProjectionLagHigh
      expr: aida_graph_projection_lag_seconds > 900
      for: 15m
      labels:
        severity: warning
        threshold_status: placeholder
      annotations:
        summary: Graph projection freshness is past the placeholder lag
        description: The 900s here is a documented placeholder, not a measured figure -- see the comment
          above this rule. Prefer AtlasProjectionBacklogGrowing and AtlasProjectionStalled while it is
          unset; both are structural.
        runbook: infra/monitoring/README.md
    - alert: AtlasProjectionBacklogAgeHigh
      expr: aida_graph_projection_oldest_backlog_seconds > 1800
      for: 15m
      labels:
        severity: warning
        threshold_status: placeholder
      annotations:
        summary: The projector's oldest buffered event is past the placeholder age
        description: One tenant's events can sit behind another's under the fair-share budget; this gauge
          is the fleet's worst case. The 1800s is a documented placeholder -- see the comment above this
          rule.
        runbook: infra/monitoring/README.md
  - name: atlas.retrieval
    rules:
    - alert: AtlasRetrievalLatencyHigh
      expr: atlas:retrieval_duration_seconds:p95_10m > 5
      for: 10m
      labels:
        severity: warning
        threshold_status: placeholder
      annotations:
        summary: p95 retrieval latency is past the placeholder ceiling
        description: The 5s here is a documented placeholder, not a measurement -- see the comment above
          this rule and the change-burst harness it names.
        runbook: infra/monitoring/README.md
    - alert: AtlasRetrievalChannelProviderUnavailable
      expr: |
        sum by (channel) (
          rate(aida_retrieval_channel_skipped_total{reason="PROVIDER_UNAVAILABLE"}[15m])
        ) > 0
      for: 15m
      labels:
        severity: warning
        threshold_status: structural
      annotations:
        summary: 'Retrieval channel {{ $labels.channel }} is being skipped: provider unavailable'
        description: 'Retrieval degrades quietly rather than failing: the remaining channels still answer,
          with worse ranking and no error for the caller to see. Needs no threshold -- the healthy value
          is zero.'
        runbook: infra/monitoring/README.md
  - name: atlas.http
    rules:
    - alert: AtlasHttpServerErrorRateHigh
      expr: atlas:http_server_error_ratio:rate15m > 0.05
      for: 10m
      labels:
        severity: critical
        threshold_status: placeholder
      annotations:
        summary: Over the placeholder share of API requests are returning 5xx
        description: The 0.05 here is a documented placeholder, not an agreed error budget -- see the
          comment above this rule. The expression reads NaN and stays silent when there is no traffic,
          so an idle deployment does not look healthy by accident.
        runbook: infra/monitoring/README.md
    - alert: AtlasHttpLatencyHigh
      expr: atlas:http_request_duration_seconds:p95_10m > 3
      for: 10m
      labels:
        severity: warning
        threshold_status: placeholder
      annotations:
        summary: p95 API latency is past the placeholder ceiling
        description: The 3s here is a documented placeholder, not a measurement -- see the comment above
          this rule.
        runbook: infra/monitoring/README.md
  - name: atlas.cost-and-quota
    rules:
    - alert: AtlasModelSpendEntirelyEstimated
      expr: |
        sum(rate(aida_model_calls_total{basis="ESTIMATED"}[1h])) > 0
          and sum(rate(aida_model_calls_total{basis="REPORTED"}[1h])) == 0
      for: 1h
      labels:
        severity: info
        threshold_status: structural
      annotations:
        summary: No model call reported provider usage this hour
        description: Every model token counted in this period is an estimate by the 4-bytes-per-token
          heuristic, not a figure a provider billed. Expect this on a deployment using fixture providers
          or a provider that reports no usage; do not quote the period's spend as chargeback.
        runbook: infra/monitoring/README.md
    - alert: AtlasUsageQuotaRefusals
      expr: |
        sum by (dimension, scope) (
          rate(aida_usage_quota_decisions_total{decision="REFUSED"}[15m])
        ) > 0
      for: 15m
      labels:
        severity: warning
        threshold_status: structural
      annotations:
        summary: A {{ $labels.scope }} quota is refusing {{ $labels.dimension }} work
        description: Either the cap is set too low for the estate's real load, or something is consuming
          far more than expected. The metric carries no tenant label by the same cardinality rule as the
          footprint gauges; the refused organization and datasource are in the usage_quota_refused structlog
          line and in the quota window rows.
        runbook: infra/monitoring/README.md
    - alert: AtlasParserFailures
      expr: |
        sum by (parser) (rate(aida_parser_statements_total{outcome="FAILED"}[15m])) > 0
      for: 15m
      labels:
        severity: warning
        threshold_status: structural
      annotations:
        summary: The {{ $labels.parser }} parser is failing outright
        description: Distinct from a definition the parser cannot read, which is counted as UNPARSEABLE
          and is normal. FAILED means sqlglot is unavailable or the parse raised, so lineage is silently
          not being extracted at all.
        runbook: infra/monitoring/README.md
  - name: atlas.scheduler
    rules:
    - alert: AtlasSchedulerNoLeader
      expr: sum(aida_scheduler_is_leader) == 0
      for: 5m
      labels:
        severity: critical
        threshold_status: structural
      annotations:
        summary: No scheduler replica has held the leadership lock for five minutes
        description: 'Every scraped scheduler replica reports standing by, so nothing is running the periodic
          passes: no scan is admitted, and the reaper, expiry, vector-index, footprint and delivery passes
          are stopped. The usual cause is a leader whose host or network vanished without closing its
          connection: PostgreSQL keeps the advisory lock until it notices, which on the operating system''s
          keepalive defaults is about 2 h 11 min. Set tcp_keepalives_idle, tcp_keepalives_interval and
          tcp_keepalives_count on the server -- section 9c of Docs/40-engineering/07-local-runbook.md
          gives 60 / 10 / 6, a two-minute detection -- and a failover finishes well inside this rule''s
          window. Other causes are an unreachable database (a scheduler_leader_lock_error line per attempt)
          and an AIDA_DATABASE_URL that points at a transaction-mode pooler, where the lock means nothing.
          This rule speaks only for replicas that are scraped: a running replica nobody scrapes may hold
          the lock unseen, and the pg_locks query in src/aida/scheduler_leadership.py names the real holder.'
        runbook: infra/monitoring/README.md
    - alert: AtlasSchedulerLeadershipFlapping
      expr: |
        sum(increase(aida_scheduler_leadership_transitions_total{transition="lost"}[1h])) >= 3
      labels:
        severity: warning
        threshold_status: placeholder
      annotations:
        summary: Scheduler leadership was lost three or more times in the last hour
        description: 'A leader whose lock verification failed stops starting passes and goes back to retrying:
          scheduler_lost_leadership in the logs, with the error class in the scheduler_leader_lock_error
          line before it. One loss is failover working. Repeated losses mean the link between the scheduler
          and PostgreSQL is unstable, and each costs a scheduling gap of up to the keepalive detection
          time. The three in the expression is a documented placeholder, not a measured rate -- see the
          comment above this rule -- so treat a firing instance as "nobody has set this yet" until an
          estate has replaced it. It counts losses a living process noticed: a leader whose process or
          host disappeared reports none, and shows as AtlasTargetDown instead.'
        runbook: infra/monitoring/README.md
    - alert: AtlasSchedulerPassFailing
      expr: sum by (scheduler_pass) (increase(aida_scheduler_pass_failures_total[15m])) >= 3
      labels:
        severity: warning
        threshold_status: placeholder
      annotations:
        summary: The scheduler's {{ $labels.scheduler_pass }} pass failed at least three times in fifteen
          minutes
        description: 'One maintenance pass keeps raising while the others run on. The scheduler backs
          a failing pass off, so this is a pass failing on nearly every attempt rather than a single fault.
          The Operations screen''s Scheduler passes panel names the exception class and when the pass
          last succeeded; the scheduler''s scheduler_pass_failed log line carries the rest. The threshold
          is a placeholder: no estate has measured its steady-state failure rate.'
        runbook: infra/monitoring/README.md
  - name: atlas.drafter
    rules:
    - alert: AtlasNewlyCreatedTableDrafterConsumerDown
      expr: aida_newly_created_table_drafter_consumer_up == 0
      for: 15m
      labels:
        severity: warning
        threshold_status: structural
      annotations:
        summary: The newly-created-table drafter has not been consuming for fifteen minutes
        description: 'Descriptions and enrichment proposals are not being drafted automatically for newly
          created tables. THIS IS EXPECTED on the default stack: auto_enqueue_on_ingest defaults to true
          and the default ten-service stack has no broker, so once the worker''s metrics port is set and
          Prometheus scrapes it, this fires until --profile events is started (or AIDA_AUTO_ENQUEUE_ON_INGEST=false
          turns the feature off, which removes the series). It cannot fire where the worker does not publish
          the gauge. Nothing is lost while it is down: offsets are committed only after a message is handled,
          PostgreSQL stays authoritative and the outbox accumulates, so drafting catches up by itself
          once a consumer starts; the newly_created_table_drafter_unavailable log line names the broker
          and the error. One case reads differently: a message that fails on every delivery keeps the
          gauge at 0 except for the moment each attempt starts, so a scrape can land on 1 and restart
          this rule''s fifteen minutes -- aida_newly_created_table_drafter_failures_total rising is the
          unambiguous sign of that loop.'
        runbook: infra/monitoring/README.md
