# Prometheus scrape configuration for the local Atlas stack (R11-FP17).
#
# This is the plain-Prometheus form, written for `compose.yaml`'s network,
# where every service is reachable by its Compose service name. The
# Prometheus-Operator form of the same intent is ../k8s/servicemonitor.yaml
# and ../k8s/podmonitor.yaml.
#
# `compose.yaml` now starts a Prometheus that reads this file, under
# `--profile monitoring` (or `--profile full`), and it is verified to do so:
# on 2026-09-17 that container loaded this config and the rule file with
# `reloadConfigSuccess: true`, `promtool check config` reported it valid, and
# `/api/v1/targets` showed `atlas-api` up. See ../README.md for what an
# operator still has to set for the other two jobs, and for what is an
# operator's number rather than a measured one. `infra/k8s/base/*` is owned
# elsewhere and is still not edited from here -- the Kubernetes form of this
# intent is ../k8s/, a separate kustomize base.
#
# Two facts shape every job below, and both are decisions somebody already
# made deliberately rather than oversights to paper over here:
#
#   1. Only `aida.main` (the `api` service) serves `/metrics` over HTTP. The
#      fleet scheduler publishes the footprint gauges and the leader-election
#      series, the graph projector publishes the projection gauges, and the
#      Temporal worker publishes the newly-created-table drafter's consumer
#      series, and until `worker_metrics_port` is set those processes expose no
#      HTTP surface at all, so the series they publish exist inside a process
#      nothing can reach. The `atlas-fleet-scheduler`, `atlas-graph-projector`
#      and `atlas-metadata-worker` jobs below scrape the listener
#      `aida.worker_metrics.serve_worker_metrics` starts when that setting is
#      non-zero; with the default of 0 they will report the target as down,
#      which is the honest reading -- there is nothing there.
#   2. `AIDA_WORKER_METRICS_PORT` has to be set for those three services for
#      their jobs to have anything to scrape. ../README.md says where.

global:
  # 15s is Prometheus' own default and is not a measurement of anything here.
  # It is chosen against the slowest producer: `footprint_metrics_interval_
  # seconds` defaults to 300, so the footprint gauges change at most once per
  # five minutes and any scrape interval at or under that loses nothing. The
  # HTTP and retrieval histograms move continuously and are the reason not to
  # relax it towards 300.
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s
  external_labels:
    # Replace with the estate's own environment name. Left as `local` rather
    # than blank so a rule that groups by it does not silently collapse two
    # environments into one series if this file is copied.
    environment: local

rule_files:
  - /etc/prometheus/rules/*.rules.yml

scrape_configs:
  # The FastAPI process. `/metrics` is `aida.main.metrics` (main.py:584), the
  # only HTTP metrics endpoint that exists today. It carries
  # `aida_http_*`, every `aida_retrieval_*` series, and -- because
  # `prometheus_client` registers into one process-global registry -- any
  # `aida_parser_*` / `aida_model_*` series produced on the request path.
  - job_name: atlas-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
        labels:
          atlas_process: api

  # The fleet scheduler: `run_footprint_metrics_pass`
  # (workflows/scheduler.py) sets `aida_footprint_gaps`,
  # `aida_footprint_oldest_pending_change_signal_seconds` and
  # `aida_footprint_metrics_organizations` here, not in the API, and the leader
  # election (`aida.scheduler_leadership`) sets `aida_scheduler_is_leader` and
  # `aida_scheduler_leadership_transitions_total`. Requires
  # `AIDA_WORKER_METRICS_PORT=9108` on the `fleet-scheduler` service. With more
  # than one replica every replica has to be scraped, each as its own target --
  # the gauge is one series per replica and `sum()` over them is the number of
  # leaders -- which one `fleet-scheduler:9108` name cannot promise (the compose
  # stack runs a single replica, where it does).
  - job_name: atlas-fleet-scheduler
    metrics_path: /metrics
    static_configs:
      - targets: ["fleet-scheduler:9108"]
        labels:
          atlas_process: fleet-scheduler

  # The graph projector: every `aida_graph_projection_*` series is published
  # here. Requires `AIDA_WORKER_METRICS_PORT=9108` on the `graph-projector`
  # service.
  - job_name: atlas-graph-projector
    metrics_path: /metrics
    static_configs:
      - targets: ["graph-projector:9108"]
        labels:
          atlas_process: graph-projector

  # The Temporal worker (`metadata-worker`): the newly-created-table drafter's
  # supervisor sets `aida_newly_created_table_drafter_consumer_up` and counts
  # `aida_newly_created_table_drafter_failures_total` here (R11-AUD03). This job
  # is here because that is the first series this process publishes -- the rule
  # this file used to state for leaving it out. Requires
  # `AIDA_WORKER_METRICS_PORT=9108` on the `metadata-worker` service, which
  # `compose.yaml` now passes through. The gauge exists only while
  # `auto_enqueue_on_ingest` is on, so an estate that turned the feature off
  # scrapes this target and finds no consumer series, which is correct.
  - job_name: atlas-metadata-worker
    metrics_path: /metrics
    static_configs:
      - targets: ["metadata-worker:9108"]
        labels:
          atlas_process: metadata-worker

  # Deliberately absent: `outbox-publisher`. It publishes no Prometheus series
  # today (grep for `prometheus_client` under `src/aida/projectors/
  # outbox_publisher.py` returns nothing), so a job for it would create a
  # permanently-down target that means nothing. Add it to this file at the same
  # time as the first metric that process publishes -- not before.
