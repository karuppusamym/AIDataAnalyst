server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Resolve the Compose service name at request time because the API
  # container's IP can change when it is recreated.
  resolver 127.0.0.11 valid=10s;
  resolver_timeout 5s;

  # ui-next calls the API using /v1/... paths. Keep the browser on one origin
  # so credentials and OIDC behaviour match the legacy portal.
  location /v1/ {
    set $api_upstream http://api:8000;
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location = /health {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok";
  }
}
