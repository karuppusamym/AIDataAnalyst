server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Resolve the Compose service name at request time because the API
  # container's IP can change when it is recreated.
  resolver 127.0.0.11 valid=10s;
  resolver_timeout 5s;

  # ui-next calls the API using /v1/... paths. Keep the browser on one origin
  # so credentials and OIDC behaviour match the legacy portal.
  location /v1/ {
    set $api_upstream http://api:8000;
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # R11-AUD05. The two routes whose request body is a metadata envelope: the
  # synchronous push (`POST /v1/datasources/{id}/metadata-ingestions`) and one
  # chunk of a durable batch (`POST /v1/metadata-ingestion-batches/{id}/chunks`).
  # They stay under /v1 -- this is a refinement of `location /v1/` above, not a
  # new public path, which is why `scripts/check_proxy_contract.py` leaves it out
  # of the dev/production prefix comparison and checks it as a body limit instead.
  #
  # Why they need their own block: `location /v1/` sets no client_max_body_size,
  # so nginx's built-in 1 MiB applied to them like to any other route. The
  # envelope contract allows far more (a synchronous body of up to 50,000 tables
  # and 250,000 columns, and a chunk is validated through that same model), so a
  # 2 MiB push answered 413 here while the identical request reached
  # authentication on the API's own port (measured 2026-09-20).
  #
  # 64m is derived from the code's own bounds, not from a byte limit -- the
  # ingestion code has none. At the caps above, with 32-character identifiers and
  # every optional field written out, the JSON is about 54 MiB
  # (`SYNC_MAX_TABLES`, `SYNC_MAX_COLUMNS` in
  # `atlas.modules.ingestion.schemas`); 64 MiB leaves about 19 % for descriptions
  # and whitespace. The batch bounds (1,000 chunks, 1,000,000 tables, 5,000,000
  # columns) cap the total across chunks, not any single request, so they do not
  # enter the figure. `tests/test_proxy_body_limits.py` recomputes the 54 MiB from
  # those constants, so raising a cap there fails a test until this is raised too.
  # A body that still does not fit belongs in more chunks, which is what the batch
  # contract is for.
  #
  # Deliberately NOT applied to `/v1/` as a whole: nginx buffers and forwards a
  # request body before the API authenticates anything, so every route given this
  # limit lets an unauthenticated caller spend that much per request. Two routes
  # earn it; the rest of the API keeps 1 MiB. The pattern is anchored on both
  # ends so the batch manifest (`.../metadata-ingestion-batches`), `finalize` and
  # the other ingestion routes -- all of which carry no envelope -- do not match,
  # and it takes the GET listings on the same two paths too, which is harmless.
  # It is a regex location, and nginx tries regex locations before falling back
  # to the longest prefix, so this wins over `/v1/` without `^~` on either.
  #
  # The proxy lines repeat `/v1/`'s rather than being shared: a location inherits
  # from the levels that enclose it, never from a sibling, so `proxy_pass` and the
  # `proxy_set_header` lines have to be spelled out here again.
  location ~ ^/v1/(datasources/[^/]+/metadata-ingestions|metadata-ingestion-batches/[^/]+/chunks)/?$ {
    set $ingestion_upstream http://api:8000;
    proxy_pass $ingestion_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 64m;
  }

  # F07 (Docs/review-2026-09-05/REVIEW.md). The MCP JSON-RPC transport is
  # mounted OUTSIDE /v1 -- `aida.mcp_server` declares `APIRouter(prefix="/mcp")`
  # with a single `POST ""` route, so the public path is exactly `/mcp`, and
  # Starlette's redirect_slashes also answers `/mcp/`. The Agent gateway screen
  # advertises `${location.origin}/mcp` as the endpoint an engineer should paste
  # into their MCP client. Without this block that path fell through to the
  # `location /` SPA fallback below, so the copied URL returned index.html --
  # the one deployment where the screen's own instructions did not work.
  #
  # Kept as a prefix match (not `location = /mcp`) so it covers `/mcp` and
  # `/mcp/` identically, and so it matches the dev proxy in `vite.config.ts`
  # key-for-key. `scripts/check_proxy_contract.py` fails CI if the two ever
  # disagree about which prefixes belong to the API.
  #
  # Authorization: nginx forwards client request headers unchanged through
  # proxy_pass, so the OIDC bearer token `get_security_context` requires arrives
  # intact; no proxy_set_header is needed for it and adding one would risk
  # dropping the rest.
  location /mcp {
    set $mcp_upstream http://api:8000;
    proxy_pass $mcp_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # `tools/call` runs a governed query through the execution gateway, which is
    # bounded by the gateway's own cost/row limits rather than by nginx's 60s
    # default. Give a legitimate long tool call room to finish instead of
    # returning a 504 that an MCP client reports as a protocol error.
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    # The endpoint returns a single buffered JSONResponse today (there is no
    # StreamingResponse or text/event-stream in `mcp_server.py`), so response
    # buffering stays ON deliberately. If a streaming MCP transport is added,
    # this block needs `proxy_buffering off;` at the same time.

    # JSON-RPC batch bodies can be larger than nginx's 1m default.
    client_max_body_size 8m;
  }

  # GraphQL is also mounted outside /v1. Keep this path paired with the Vite
  # proxy so the Agent gateway explorer reaches the API in both environments.
  location = /graphql {
    set $graphql_upstream http://api:8000;
    proxy_pass $graphql_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 128k;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location = /health {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok";
  }
}
