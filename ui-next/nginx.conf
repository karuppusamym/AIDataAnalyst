server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Resolve the Compose service name at request time because the API
  # container's IP can change when it is recreated.
  resolver 127.0.0.11 valid=10s;
  resolver_timeout 5s;

  # ui-next calls the API using /v1/... paths. Keep the browser on one origin
  # so credentials and OIDC behaviour match the legacy portal.
  location /v1/ {
    set $api_upstream http://api:8000;
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # F07 (Docs/review-2026-09-05/REVIEW.md). The MCP JSON-RPC transport is
  # mounted OUTSIDE /v1 -- `aida.mcp_server` declares `APIRouter(prefix="/mcp")`
  # with a single `POST ""` route, so the public path is exactly `/mcp`, and
  # Starlette's redirect_slashes also answers `/mcp/`. The Agent gateway screen
  # advertises `${location.origin}/mcp` as the endpoint an engineer should paste
  # into their MCP client. Without this block that path fell through to the
  # `location /` SPA fallback below, so the copied URL returned index.html --
  # the one deployment where the screen's own instructions did not work.
  #
  # Kept as a prefix match (not `location = /mcp`) so it covers `/mcp` and
  # `/mcp/` identically, and so it matches the dev proxy in `vite.config.ts`
  # key-for-key. `scripts/check_proxy_contract.py` fails CI if the two ever
  # disagree about which prefixes belong to the API.
  #
  # Authorization: nginx forwards client request headers unchanged through
  # proxy_pass, so the OIDC bearer token `get_security_context` requires arrives
  # intact; no proxy_set_header is needed for it and adding one would risk
  # dropping the rest.
  location /mcp {
    set $mcp_upstream http://api:8000;
    proxy_pass $mcp_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # `tools/call` runs a governed query through the execution gateway, which is
    # bounded by the gateway's own cost/row limits rather than by nginx's 60s
    # default. Give a legitimate long tool call room to finish instead of
    # returning a 504 that an MCP client reports as a protocol error.
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    # The endpoint returns a single buffered JSONResponse today (there is no
    # StreamingResponse or text/event-stream in `mcp_server.py`), so response
    # buffering stays ON deliberately. If a streaming MCP transport is added,
    # this block needs `proxy_buffering off;` at the same time.

    # JSON-RPC batch bodies can be larger than nginx's 1m default.
    client_max_body_size 8m;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location = /health {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok";
  }
}
